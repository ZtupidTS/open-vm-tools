name: Build open-vm-tools

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            automake autoconf libtool \
            pkg-config \
            libcurl4-openssl-dev \
            curl \
            protobuf-compiler protobuf libprotobuf-dev \
            grpc++ protobuf-compiler-grpc libgrpc++-dev \
            golang-github-containerd-containerd-dev \
            golang-github-gogo-protobuf-dev

      - name: Prepare build
        run: autoreconf -i

      - name: Configure
        run: ./configure --enable-containerinfo=no

      - name: Build
        run: make -j$(nproc)

      - name: Package (make install into staging)
        run: |
          mkdir -p build-out
          sudo make DESTDIR=build-out install

      - name: Create tarball
        run: |
          tar -czvf open-vm-tools.tar.gz build-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-vm-tools-build
          path: open-vm-tools.tar.gz
